<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <div id="nav"><b>Rock paper Scissors</b></div>
    <div id="container">
        <div id="img_container">
            <img id="rock" src="./rock.png" alt="">
            <img id="paper" src="./paper.png" alt="">
            <img id="scissor" src="./scissor.png" alt="">
        </div>

        <div id="scoreBoard">
            <span class="score" id="player_score">0</span>
            <span class="score" id="comp_score">0</span>
            <br>
            <span class="names">You</span>
            <span class="names">Comp</span>
            
        </div>

        <div id="msg_container">Pick your move</div>
        <p></p>
    </div>
    <script src="./script.js"></script>
</body>
</html>
